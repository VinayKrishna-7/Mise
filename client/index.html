    <!-- Zero-flash inline theme loader -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('mise_theme') || localStorage.getItem('recipehub_theme');
          if (saved && !localStorage.getItem('mise_theme')) {
            localStorage.setItem('mise_theme', saved);
          }
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
